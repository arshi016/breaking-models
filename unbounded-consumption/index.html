<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breaking Models · links</title>
<style>
  :root { --bg: #FBF3E7; --ink: #2B1A10; --dim: #6E5A4A; --accent: #B8440B; --card: #FFFFFF; --line: #E9DCC8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { min-height: 100svh; max-width: 480px; margin: 0 auto; padding: 24px 20px;
         display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .eyebrow { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 2px 0 10px; font-size: 30px; line-height: 1.1; }
  a.link { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           text-decoration: none; color: var(--ink); background: var(--card);
           border: 1px solid var(--line); border-radius: 14px; padding: 13px 16px; }
  a.link:focus-visible, a.link:hover { border-color: var(--accent); outline: none; }
  .name { font-size: 17px; font-weight: 700; }
  .what { font-size: 14px; color: var(--dim); text-align: right; }
</style>
</head>

  </a>
  <a class="link" href="https://www.linkedin.com/in/arshichadha/">
    <span class="name">LinkedIn</span><span class="what">Arshi Chadha</span>
  </a>
